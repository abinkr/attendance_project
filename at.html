<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attendance Form</title>
  <link rel="stylesheet" href="at.css">
</head>
<body>
  <div class="card">
    <h2>Class Attendance</h2>

    <!-- class selection -->
    <div class="class-buttons" role="tablist" aria-label="Select class">
      <button class="class-btn" data-class="BCA_1ST_YEAR">BCA 1st Year</button>
      <button class="class-btn" data-class="BCA_2ND_YEAR">BCA 2nd Year</button>
      <button class="class-btn" data-class="BCA_3RD_YEAR">BCA 3rd Year</button>
    </div>

    <!-- subject + date + faculty inputs -->
    <div class="meta-wrap">
      <label for="subject">Subject:</label>
      <input id="subject" class="meta" type="text" placeholder="Type subject name (e.g. Math)" />

      <label for="date">Date:</label>
      <input id="date" class="meta" type="date" />

      <label for="faculty">Faculty:</label>
      <input id="faculty" class="meta" type="text" placeholder="Enter faculty name" />
    </div>

    <div class="controls">
      <input id="search" placeholder="Filter by roll or name" />
      <!-- single toggle button replaces separate "mark all present" / "mark all absent" buttons -->
      <button id="markAllToggle" class="toggle-btn">Mark All Present</button>
      <button id="exportCsv" class="export">Export CSV</button>
    </div>

    <table id="studentsTable" aria-live="polite">
      <thead>
        <tr><th>Roll</th><th>Name</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

    let currentClass = 'BCA_1ST_YEAR'; // default class
    let students = []; // will hold current class students with status

    function todayISO() {
      const d = new Date();
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const dd = String(d.getDate()).padStart(2,'0');
      return `${d.getFullYear()}-${mm}-${dd}`;
    }

    // sanitise a string for use in filenames
    function sanitizeName(s) {
      return (s || 'attendance')
        .trim()
        // replace 1+ disallowed characters with a single underscore
        .replace(/[^a-z0-9\-]+/ig, '_')
        // remove leading/trailing underscores
        .replace(/^_+|_+$/g, '')
        .toLowerCase()
        .slice(0, 100);
    }

    // format date as MM/DD/YYYY (e.g. 11/18/2025)
    function formatShortDateMMDDYYYY(dateRaw) {
      if (!dateRaw) return '';
      const d = new Date(dateRaw);
      if (Number.isNaN(d.getTime())) return dateRaw;
      return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
    }

    // format time as HH:MM:SS (24-hour)
    function formatTimeHHMMSS(dateLike) {
      const d = (dateLike instanceof Date) ? dateLike : new Date(dateLike);
      if (Number.isNaN(d.getTime())) return '';
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      const ss = String(d.getSeconds()).padStart(2,'0');
      return `${hh}:${mm}:${ss}`;
    }

    // storage keys per class
    function keyStudents(cls){ return `attendance_students_${cls}`; }
    function keyMeta(cls){ return `attendance_meta_${cls}`; }

    function saveState() {
      localStorage.setItem(keyStudents(currentClass), JSON.stringify(students));
      localStorage.setItem(keyMeta(currentClass), JSON.stringify({
        subject: subjectInput.value || '',
        date: dateInput.value || '',
        faculty: facultyInput.value || ''
      }));
    }

    function loadStateForClass(cls) {
      // initialize students from CLASS_DATA (deep copy) and default status absent
      const base = (CLASS_DATA[cls] || []).map(s => ({ roll: s.roll, name: s.name, status: 'absent' }));
      const raw = localStorage.getItem(keyStudents(cls));
      if (raw) {
        try {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            // merge saved statuses into base by roll
            const map = new Map(arr.map(s => [s.roll, s.status]));
            base.forEach(b => { if (map.has(b.roll)) b.status = map.get(b.roll); });
          }
        } catch(e){}
      }
      // load meta
      const metaRaw = localStorage.getItem(keyMeta(cls));
      if (metaRaw) {
        try {
          const meta = JSON.parse(metaRaw);
          subjectInput.value = meta.subject || '';
          dateInput.value = meta.date || '';
          facultyInput.value = meta.faculty || '';
        } catch(e){}
      } else {
        if (!dateInput.value) dateInput.value = todayISO();
      }
      students = base;
    }

    function setActiveClassButton(cls){
      classButtons.forEach(b => b.classList.toggle('active', b.dataset.class === cls));
    }

    function render(filter='') {
      tbody.innerHTML = '';
      const q = (filter || '').trim().toLowerCase();
      students.forEach((s) => {
        if (q && !(s.roll.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))) return;
        const tr = document.createElement('tr');

        const tdRoll = document.createElement('td'); tdRoll.textContent = s.roll; tr.appendChild(tdRoll);
        const tdName = document.createElement('td'); tdName.textContent = s.name; tr.appendChild(tdName);

        const tdStatus = document.createElement('td');
        const span = document.createElement('span');
        span.className = 'status ' + (s.status === 'present' ? 'present' : 'absent');
        span.textContent = s.status === 'present' ? 'Present' : 'Absent';
        tdStatus.appendChild(span);
        tr.appendChild(tdStatus);

        const tdAction = document.createElement('td');
        const btn = document.createElement('button');
        btn.className = 'toggle-btn';
        btn.textContent = s.status === 'present' ? 'Mark Absent' : 'Mark Present';
        btn.addEventListener('click', () => {
          s.status = s.status === 'present' ? 'absent' : 'present';
          saveState();
          render(search.value);
        });
        tdAction.appendChild(btn);
        tr.appendChild(tdAction);

        tbody.appendChild(tr);
      });
      // update the toggle button text/color based on current state
      try{ updateToggleText(); }catch(e){}
    }

    // class button handlers
    classButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cls = btn.dataset.class;
        if (cls === currentClass) return;
        currentClass = cls;
        setActiveClassButton(cls);
        loadStateForClass(cls);
        render(search.value);
      });
    });

    // helper to determine whether all students are currently marked present
    function allPresent(){ return students.length > 0 && students.every(s => s.status === 'present'); }

    // update the toggle button text and color to reflect current state
    function updateToggleText(){
      if(!markAllToggle) return;
      if(allPresent()){
        markAllToggle.textContent = 'Mark All Absent';
        // blue when action will mark absent
        markAllToggle.style.background = '#0683f0';
      } else {
        markAllToggle.textContent = 'Mark All Present';
        // green when action will mark present
        markAllToggle.style.background = '#28a745';
      }
      markAllToggle.style.color = '#fff';
    }

    // single toggle button: if any absent -> mark all present, otherwise mark all absent
    if(markAllToggle){
      markAllToggle.addEventListener('click', () => {
        const makePresent = !allPresent();
        students.forEach(s => s.status = makePresent ? 'present' : 'absent');
        saveState(); render(search.value);
      });
    }

    document.getElementById('exportCsv').addEventListener('click', () => {
      const subject = subjectInput.value || '';
      const dateRaw = dateInput.value || todayISO();             // 'YYYY-MM-DD'
      const shortDate = formatShortDateMMDDYYYY(dateRaw);        // 'MM/DD/YYYY' (e.g. 11/18/2025)
      const exactTime = formatTimeHHMMSS(new Date());           // 'HH:MM:SS'
      const faculty = facultyInput.value || '';

      const rows = [
        ['Class', currentClass],
        ['Subject', subject],
        ['Date', shortDate],
        ['Time', exactTime],
        ['Faculty', faculty],
        []
      ].concat([['Roll','Name','Status'], ...students.map(s => [s.roll, s.name, s.status])]);

      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      // prepend BOM so Excel recognises UTF-8
      const blob = new Blob(["\uFEFF", csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      // filename uses shortDate (slashes -> dashes) and time (colons removed)
      const datePart = shortDate.replace(/\//g, '-');    // 11-18-2025
      const timePart = exactTime.replace(/:/g, '');      // 143205
      const fileNameSafe = `${currentClass}_${sanitizeName(subject)}_${datePart}_${timePart}.csv`;

      const a = document.createElement('a'); a.href = url; a.download = fileNameSafe; a.click();
      URL.revokeObjectURL(url);
    });

    search.addEventListener('input', () => render(search.value));
    subjectInput.addEventListener('input', saveState);
    dateInput.addEventListener('input', saveState);
    facultyInput.addEventListener('input', saveState);

    // init default class
    (function init(){
      setActiveClassButton(currentClass);
      loadStateForClass(currentClass);
      render();
    })();
  </script>
</body>
</html>
